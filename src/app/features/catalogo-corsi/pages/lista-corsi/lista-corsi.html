<div class="container mt-4">

  @if (facade.loading()) {
    <div class="text-center my-5">
      <div class="spinner-border" role="status"></div>
    </div>
  } @else if (facade.errore()) {
    <div class="alert alert-danger">{{ facade.errore() }}</div>
  } @else if (facade.corsi().length === 0) {
    <div class="alert alert-info">Nessun elemento trovato.</div>
  } @else {
    <div class="row g-4">
      @for (corso of corsi(); track $index) {
        <div class="col-md-6 col-sm-6 col-lg-4">
          <app-dynamic-card-container
            [data]="{ tipo: 'corso', payload: corso }"
            (click)="onCardClick(corso.idCorso)">
          </app-dynamic-card-container>
        </div>
      }
    </div>
  }

</div>
