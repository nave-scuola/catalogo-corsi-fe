<div class="container mt-4">
  <h1 class="titolo text-center">{{ titolo }}</h1>

  <button class="btn mb-3" [class.btn-info]="theme.tema() === 'dark'" [class.btn-danger]="theme.tema() === 'light'"
    (click)="theme.toggleTema()">
    Cambia Tema
  </button>

  <input type="text" placeholder="Filtra corsi tramite titolo, codice o descrizione" [value]="filtroTesto()"
    (input)="filtroTesto.set($any($event.target).value)"
    class="form-control mb-3 border-2 bg-black text-light" />

  <div class="row g-4">
    @for (card of corsi(); track $index) {
    <div class="col-md-6 col-sm-6 col-lg-4">
      <app-dynamic-card-container [data]="card"></app-dynamic-card-container>
    </div>
    }
  </div>

</div>
