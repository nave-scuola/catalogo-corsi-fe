<div class="container mt-lg-4">
  <div class="card p-3 bg-info bg-opacity-10 text-light text-opacity-75 border-2 border-info border-opacity-25 
 d-flex flex-column">
    <div class="card-body d-flex flex-column">
      <h3 class="font-monospace text-center">**{{ corso()?.titolo }}**</h3>
      <p>{{ corso()?.descrizione }} - {{corso()?.codiceCorso}}</p>
      <div class="card-text py-3 bg-info bg-opacity-25 m-2 p-3 d-flex rounded-4">
        <ul>
          <li>Livello: {{ corso()?.livello }}</li>
          <li>Durata: {{ corso()?.durataOre }} ore</li>
          <li>Descrizione: {{corso()?.descrizione}}</li>
        </ul>
      </div>
    </div>
  </div>
</div>
