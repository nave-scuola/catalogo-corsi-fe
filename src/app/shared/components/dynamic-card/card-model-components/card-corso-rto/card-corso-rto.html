<div class="card p-3 bg-info bg-opacity-10 text-light border-info border-2">
  <h3 class="font-monospace text-center">{{ data().titolo }}</h3>

  <div class="card-body">
    <p>{{ data().descrizione }}</p>

    <ul>
      <li>Codice: {{ data().codiceCorso }}</li>
      <li>Livello: {{ data().livello }}</li>
      <li>Durata: {{ data().durataOre }} ore</li>
      <li>Categoria: {{ data().categoria }}</li>
    </ul>
    <button class="btn btn-danger mt-3" (click)="onElimina()">
      Elimina Corso
    </button>
  </div>
</div>
